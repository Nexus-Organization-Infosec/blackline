[project]
name = "blackline"
version = "0.1.0"
description = "CLI automation framework for authorized security workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["dnspython>=2.6", "prompt_toolkit>=3.0.43"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pre-commit>=3.7"]

[project.scripts]
blackline = "blackline.cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
